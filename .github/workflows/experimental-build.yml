name: R68S experimental HAOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experimental-build.yml'
      - 'board/r68s/**'
      - 'patches/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      haos_sha:
        description: 'Reviewed 40-character commit SHA from official HAOS'
        required: true
        default: '945ba38d88e7e7d7321d42294b222b8deb2208d2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: r68s-haos-build
      cancel-in-progress: true
    env:
      HAOS_SHA: ${{ inputs.haos_sha || '945ba38d88e7e7d7321d42294b222b8deb2208d2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned official HAOS source
        run: |
          git clone https://github.com/home-assistant/operating-system.git haos
          [[ "$HAOS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Use official HAOS commit SHA only"; exit 1; }
          git -C haos checkout --detach "$HAOS_SHA"
          git -C haos submodule update --init --recursive

      - name: Validate U-Boot patch syntax before long builds
        run: |
          git apply --numstat patches/uboot/0001-r68s-add-u-boot-dtsi.patch
          git apply --numstat patches/linux/0001-r68s-enable-hardware-watchdog.patch

      - name: Apply R68S board integration
        run: bash scripts/prepare-haos.sh haos "$HAOS_SHA"

      - name: Install persistent RAUC signing key if configured
        env:
          R68S_KEY_B64: ${{ secrets.R68S_RAUC_KEY_PEM_B64 }}
          R68S_CERT_B64: ${{ secrets.R68S_RAUC_CERT_PEM_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$R68S_KEY_B64" && -z "$R68S_CERT_B64" ]]; then
            echo "OTA_SIGNING=DEVELOPMENT_EPHEMERAL: do not use this image for long-term OTA"
            echo "OTA_SIGNING_READY=false" >> "$GITHUB_ENV"
          elif [[ -z "$R68S_KEY_B64" || -z "$R68S_CERT_B64" ]]; then
            echo "Both R68S_RAUC_KEY_PEM_B64 and R68S_RAUC_CERT_PEM_B64 are required" >&2
            exit 1
          else
            umask 077
            printf '%s' "$R68S_KEY_B64" | base64 --decode > haos/key.pem
            printf '%s' "$R68S_CERT_B64" | base64 --decode > haos/cert.pem
            openssl x509 -in haos/cert.pem -checkend 2592000 -noout
            key_pub="$(openssl pkey -in haos/key.pem -pubout | sha256sum | cut -d' ' -f1)"
            cert_pub="$(openssl x509 -in haos/cert.pem -pubkey -noout | sha256sum | cut -d' ' -f1)"
            test "$key_pub" = "$cert_pub" || { echo "Key and certificate mismatch" >&2; exit 1; }
            echo "OTA_SIGNING_READY=true" >> "$GITHUB_ENV"
            echo "OTA_SIGNING=PERSISTENT"
          fi

      - name: Prepare build space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/cache/dl /mnt/cache/cc /mnt/output
          sudo chown -R "$(id -u):$(id -g)" /mnt/cache /mnt/output
          df -h

      - name: Build official HAOS builder container
        run: docker build --tag haos-builder:r68s --file haos/Dockerfile haos

      - name: Configure Buildroot
        run: |
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "$PWD/haos:/build" -v "/mnt/cache:/cache" -v "/mnt/output:/build/output" \
            haos-builder:r68s make r68s-config

      - name: Compile experimental image
        run: |
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "$PWD/haos:/build" -v "/mnt/cache:/cache" -v "/mnt/output:/build/output" \
            haos-builder:r68s make

      - name: Validate output presence and SHA256
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(/mnt/output/images/haos_r68s-*.img.xz)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected exactly one R68S raw image; got ${#images[@]}" >&2
            exit 1
          fi
          test -s "${images[0]}"
          sh scripts/check-build-configs.sh /mnt/output
          bundles=(/mnt/output/images/haos_r68s-*.raucb)
          test "${#bundles[@]}" -eq 1
          # host/bin/rauc and its bundled host libraries are built inside the
          # Debian Trixie builder. Run the verifier in that same image rather
          # than on the Ubuntu 22.04 runner, whose glibc is too old.
          docker run --rm \
            --volume "$PWD/scripts/check-safe-ota-bundle.py:/workspace/check-safe-ota-bundle.py:ro" \
            --volume "/mnt/output:/mnt/output:ro" \
            --volume "$PWD/haos/buildroot-external/ota/rel-ca-xsign-oldroot.cert.pem:/workspace/rel-ca-xsign-oldroot.cert.pem:ro" \
            --env PATH="/mnt/output/host/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --entrypoint python3 \
            haos-builder:r68s \
            /workspace/check-safe-ota-bundle.py "${bundles[0]}" \
              /mnt/output/host/bin/rauc \
              /mnt/output/target/etc/rauc/keyring.pem \
              /mnt/output/target/etc/rauc/system.conf \
              /workspace/rel-ca-xsign-oldroot.cert.pem
          python3 scripts/check-image-gpt.py "${images[0]}"
          sha256sum "${images[0]}" | tee /mnt/output/images/SHA256SUMS-R68S-UNVERIFIED
          echo "IMAGE_BUILD_ONLY=1: NOT TESTED ON R68S; DO NOT FLASH"

      - name: Upload unverified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: R68S-HAOS-UNVERIFIED-DO-NOT-FLASH
          path: |
            /mnt/output/images/haos_r68s-*.img.xz
            /mnt/output/images/SHA256SUMS-R68S-UNVERIFIED
          if-no-files-found: error
          retention-days: 7

      - name: Upload R68S-only signed OTA bundle
        if: env.OTA_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: R68S-HAOS-SIGNED-OTA-UNVERIFIED
          path: /mnt/output/images/haos_r68s-*.raucb
          if-no-files-found: error
          retention-days: 7

      - name: Remove private signing key from workspace
        if: always()
        run: rm -f haos/key.pem
